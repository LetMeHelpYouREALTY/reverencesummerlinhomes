name: Deploy Preview

on:
  push:
    branches-ignore: [ main ]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      
    # Vercel Git integration deploys previews on push; redundant CLI deploy
    # often fails when VERCEL_* secrets are stale ("Project not found").
    - name: Comment PR with Preview URL
      if: github.event_name == 'pull_request'
      permissions:
        pull-requests: write
        issues: write
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Preview deployed')
          );
          
          const previewUrl = 'See the Vercel bot comment on this PR for the preview URL (Git integration deploys on push).';
          
          const commentBody = `🚀 **Preview build passed**\n\n🔗 **Preview:** ${previewUrl}\n\n📝 **Branch:** \`${context.ref.replace('refs/heads/', '')}\`\n\n✅ **Status:** Vercel Git deploy handles hosting; this job validates \`npm run build\`.`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }
